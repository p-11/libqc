name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "changed=$([[ \"$CURRENT\" != \"$PREVIOUS\" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        if: steps.version.outputs.changed == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10.20.0

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24.15.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build library (Prod)
        if: steps.version.outputs.changed == 'true'
        run: pnpm run build:prod

      - name: Verify build output
        if: steps.version.outputs.changed == 'true'
        run: pnpm run validate:prod

      - name: Configure git
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag and publish
        if: steps.version.outputs.changed == 'true'
        run: |
          git tag "v${{ steps.version.outputs.current }}"
          npm publish --no-git-checks
          git push origin "v${{ steps.version.outputs.current }}" --no-verify
